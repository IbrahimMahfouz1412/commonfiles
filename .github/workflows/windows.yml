name: Build Windows x64

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish win-x64 (single self-contained exe)
        run: dotnet publish src/FileSplitter -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish/x64

      - name: Split/join round-trip tests
        shell: pwsh
        run: ./tests/test-cli.ps1 -Exe publish/x64/FileSplitter.exe

      - name: GUI tests (split, join, cancel)
        shell: pwsh
        run: ./tests/test-gui.ps1 -Exe publish/x64/FileSplitter.exe -Work "$env:RUNNER_TEMP\gui"

      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-screenshots
          path: ${{ runner.temp }}/gui/*.png
          if-no-files-found: ignore

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/x64/FileSplitter.exe, README.md -DestinationPath FileSplitter-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FileSplitter-win-x64
          path: publish/x64/FileSplitter.exe

      - name: Publish GitHub release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FileSplitter-win-x64.zip
          generate_release_notes: true
